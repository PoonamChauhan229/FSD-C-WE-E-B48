          Promise  >> Pending || Fulfilled || Rejected

          Fulfilled >> resolve|| Rejected >>reject >>Errors  >> handling errors 

          JS >> 
          synchronous scripting language >>queue >>

          >>blocking at time >> execeution time more

    <script>
        // arr.map(()=>{})
        // p1.add(,()=>{})
        // new is a keyword >>create a object
        // cbk >> one function 
        // [[Prototype]] :  Promise
        // [[PromiseState]]: "pending"
        // [[PromiseResult]]: undefined
        const p1 = new Promise((resolve, reject) => {
            let sucess = true

            if (sucess) {
                resolve("Hey, m resolved")
            } else {
                reject("Hey unresolved")
            }
        })
        console.log(p1) // object 
        // .then() >> fulfiled >> value
        // .catch() >> rejected >> handle err + message

        p1.then((data) => console.log(data)).catch((err) => console.log(err))

        // connecting a API
        // https://www.postman.com/what-is-an-api/
        // https: >>Protocol
        // www.postman.com >> hosting server
        // /what-is-an-api/ >> Endpoint  >> API Endpoints

        // fetch() >> returns a promises >> resolved || rejected
        // fetch(url,method) >> GET method >> retrival from 
        // .then >> response (readable stream format) >> json >> json()
        // .then >> fulfilled 
        const res = fetch("https://jsonplaceholder.typicode.com/todos")

        res.then((val) => val.json())
            .then((data) => console.log(data))
            .catch((err) => console.log(err))


        
fetch("https://jsonplaceholder.typicode.com/todos")
            .then((val) => val.json())
            .then((data) => console.log(data))
            .catch((err) => console.log(err))
        // multple promises

        const p2 = new Promise((resolve, reject) => resolve("Hey, m resolved"))
        const p3 = new Promise((resolve, reject) => resolve("Hey, m resolved"))
        const p4 = new Promise((resolve, reject) =>
            setTimeout(() => {
                // block of code  >>   // 1000 ms 
                resolve("Hey, m resolved")
            },5000)
        )
        const p5 = new Promise((resolve, reject) => resolve("resolved"))

        Promise.all([p2, p3, p4, p5])
            .then((data) => console.log(data))
            .catch((err) => console.log(err))
        
            // return type array >> fulfilled values 


         







    </script>
